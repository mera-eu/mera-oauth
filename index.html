<!doctype html>
<html>
  <body>
    <script>
      // Decap CMS OAuth proxy
      // https://decapcms.org/docs/oauth-provider/
      function sendToken() {
        const params = new URLSearchParams(window.location.hash.slice(1));
        const token = params.get("access_token");

        if (token) {
          window.opener.postMessage(
            {
              token: token,
              provider: "github"
            },
            window.location.origin
          );
          window.close();
        } else {
          document.body.innerHTML = "<h2>OAuth Error – no token returned.</h2>";
        }
      }

      sendToken();
    </script>
  </body>
</html>
